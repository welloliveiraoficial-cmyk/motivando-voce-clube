<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#031A3D">

  <meta
    name="description"
    content="Motivando Você Clube — Histórias, inspiração e esperança para uma vida melhor."
  >

  <title>Motivando Você Clube</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==========================================
       TELA DE ABERTURA
  =========================================== -->

  <section id="splashScreen" class="splash-screen">

    <!-- Brilho decorativo -->
    <div class="ambient-light light-one"></div>
    <div class="ambient-light light-two"></div>


    <!-- Imagem de fundo -->
    <div class="splash-background"></div>


    <!-- Escurecimento -->
    <div class="splash-overlay"></div>


    <!-- Conteúdo -->
    <div class="splash-content">

      <div class="splash-logo-area">

        <img
          src="assets/logo.png"
          alt="Motivando Você Clube"
          class="splash-logo"
        >

      </div>


      <div class="splash-text">

        <p class="splash-description">
          Histórias, inspiração<br>
          e esperança para<br>
          uma vida melhor.
        </p>

      </div>


      <!-- Área inferior -->
      <div class="loading-area">

        <div class="loading-bar">

          <div class="loading-progress"></div>

        </div>

        <p class="loading-text">
          Carregando...
        </p>

      </div>

    </div>

  </section>


  <!-- ==========================================
       LOGIN
       Será desenvolvido na próxima etapa
  =========================================== -->

  <section
    id="loginScreen"
    class="login-screen hidden"
  >

  </section>


  <script src="script.js"></script>

</body>

</html>
